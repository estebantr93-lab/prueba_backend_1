<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}EcoEnergy{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-success">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{% url 'dispositivos:inicio' %}">ECOENERGY</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="{% url 'dispositivos:inicio' %}">Inicio</a>
                    <a class="nav-link" href="{% url 'dispositivos:listado_zonas' %}">Zonas</a>
                    <a class="nav-link" href="{% url 'dispositivos:resumen_zonas' %}">Resumen</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        {% block contenido %}{% endblock %}
    </main>

    
    <footer class="container text-center text-muted py-4 border-top">
        <small>EcoEnergy · Monitoreo de consumo energético</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
